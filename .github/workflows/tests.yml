name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --no-deps -e .
      - name: Syntax and unit tests
        run: |
          python -m py_compile src/cxr_ldc_eval/*.py tests/*.py
          python -m unittest discover -s tests -v
      - name: Config and synthetic CLI smoke
        run: |
          ldc-eval validate-config
          ldc-eval records --input examples/synthetic_records.jsonl --output-dir /tmp/cxr_ldc_demo --output-prefix synthetic
